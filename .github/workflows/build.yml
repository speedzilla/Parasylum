name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (M1+)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python pygame numpy pyinstaller
      - run: pyinstaller --onefile --windowed --name WatchingEye eye.py
      - name: Add camera permission to Info.plist
        run: |
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'The eye needs the camera to track the LED.'" \
            dist/WatchingEye.app/Contents/Info.plist
      - name: Zip app bundle (preserves structure)
        run: ditto -c -k --keepParent dist/WatchingEye.app WatchingEye-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WatchingEye-apple-silicon
          path: WatchingEye-apple-silicon.zip
