name: Build macOS apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (M1+)
            arch: apple-silicon
          - os: macos-13       # Intel
            arch: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python pygame numpy pyinstaller
      - run: pyinstaller --onefile --windowed --name WatchingEye eye.py
      - name: Add camera permission to Info.plist
        run: |
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'The eye needs the camera to track the LED.'" \
            dist/WatchingEye.app/Contents/Info.plist
      - name: Zip app bundle (preserves structure)
        run: ditto -c -k --keepParent dist/WatchingEye.app WatchingEye-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WatchingEye-${{ matrix.arch }}
          path: WatchingEye-${{ matrix.arch }}.zip
